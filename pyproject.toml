[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longcache"
version = "1.0.0"
description = "超长上下文 MoE 推理引擎与 KV Cache 智能管理平台"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "longcache Contributors"}]
keywords = ["kv-cache", "moe", "long-context", "inference", "deepseek", "sparse-attention", "llm"]
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.24"]

[project.scripts]
longcache = "longcache.cli:main"

[tool.setuptools.packages.find]
include = ["longcache*"]
